[package]
name = "rogueball"
version = "0.1.0"
edition = "2024"

[dependencies]
fastrand = "2.5.0"
macroquad = { version = "0.4", features = ["audio"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Input_XboxController"] }

[profile.release]
opt-level = 3
